name: Format Assist

on:
  push:
    branches: [feat/configurable-request-pipeline]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format
      - run: git diff --name-only > formatted-files.txt
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            formatted-files.txt
            mcp/
            scripts/
            test/
            package.json
            server.json
          if-no-files-found: error
          retention-days: 1
