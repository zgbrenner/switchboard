<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Switchboard</title>
  <link rel="stylesheet" href="styles/popup.css">
</head>
<body>
  <main>
    <header><span class="mark">S</span><div><h1>Switchboard</h1><p id="state">Loading…</p></div></header>
    <label><span>Enabled</span><input id="enabled" type="checkbox"></label>
    <label><span>Automatic switching</span><input id="auto-switch" type="checkbox"></label>
    <label class="stack"><span>Routing policy</span>
      <select id="policy"><option value="best">Best quality</option><option value="balanced">Balanced</option><option value="fast">Fast</option><option value="conserve">Conserve premium use</option></select>
    </label>
    <button id="open-options" type="button">Privacy and advanced settings</button>
    <p class="privacy">Prompts and file contents stay in this browser.</p>
  </main>
  <script type="module" src="js/extension/popup.js"></script>
</body>
</html>
